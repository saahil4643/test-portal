{% extends 'base.html' %}

{% block title %}Create Admin - TestPortal{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">Create Admin Account</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            
            <div class="form-group">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="text" id="phone" name="phone" required>
            </div>
            
            <button type="submit" style="width: 100%;">Create Admin</button>
            
            <p style="text-align: center; margin-top: 1rem; color: #666;">
                Already have an account? <a href="{% url 'accounts:login' %}" style="color: #667eea;">Login here</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
