{% extends 'base.html' %}

{% block title %}Admin Login - TestPortal{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">Admin Login</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" style="width: 100%;">Login</button>
            
            <p style="text-align: center; margin-top: 1rem; color: #666;">
                Don't have an account? <a href="{% url 'accounts:create_admin' %}" style="color: #667eea;">Create one</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
