{% extends 'base.html' %}

{% block title %}Add Student - TestPortal{% endblock %}

{% block content %}
<div class="card">
    <h2>Add Student{% if is_hod %} to {{ department }}{% endif %}</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            
            <div class="form-group">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="phone">Phone *</label>
                <input type="text" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="roll_number">Roll Number *</label>
                <input type="text" id="roll_number" name="roll_number" required>
            </div>
        </div>
        
        {% if not is_hod %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="department">Department *</label>
                <input type="text" id="department" name="department" required>
            </div>
            
            <div class="form-group">
                <label for="year">Year *</label>
                <input type="number" id="year" name="year" value="1" min="1">
            </div>
        </div>
        {% else %}
        <div class="form-group">
            <label for="year">Year *</label>
            <input type="number" id="year" name="year" value="1" min="1">
        </div>
        {% endif %}
        
        <div class="form-group">
            <label for="division">Division *</label>
            <input type="text" id="division" name="division" required>
        </div>
        
        <button type="submit">Add Student</button>
        <a href="{% if is_hod %}{% url 'accounts:hod_dashboard' %}{% else %}{% url 'accounts:list_student' %}{% endif %}" style="text-decoration: none; margin-left: 0.5rem;">
            <button type="button" class="btn-secondary">Cancel</button>
        </a>
    </form>
</div>
{% endblock %}
